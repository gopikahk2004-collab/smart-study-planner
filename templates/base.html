<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Study Planner{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="navbar">
    <a class="logo" href="{{ url_for('index') }}">📚 StudyFlow</a>
    <nav>
        <a href="{{ url_for('index') }}">Dashboard</a>
        <a href="{{ url_for('subjects') }}">Subjects</a>
        <a href="{{ url_for('planner') }}">Study Plan</a>
    </nav>
    <button id="themeBtn" class="theme-btn">🌙</button>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
